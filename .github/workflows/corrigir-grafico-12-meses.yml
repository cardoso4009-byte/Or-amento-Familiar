name: Corrigir grafico 12 meses
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Garantir 12 pontos de Jan a Dez
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/controle/page.tsx')
          s=p.read_text()
          start=s.index('function Line(')
          end=s.index('\nfunction MonthlyFlow', start)
          new='''function Line({values,suffix='' }:{values:number[];suffix?:string}){const series=meses.map((_,i)=>Number(values[i]??0));const w=640,h=180,p=22,max=Math.max(...series,1),min=Math.min(...series,0),range=Math.max(max-min,1),x=(i:number)=>p+i*(w-p*2)/Math.max(meses.length-1,1),y=(v:number)=>h-p-(v-min)/range*(h-p*2),points=series.map((v,i)=>`${x(i)},${y(v)}`).join(' ');return <div className="lineChartWrap"><svg viewBox={`0 0 ${w} ${h}`} className="lineChart"><line x1={p} y1={y(0)} x2={w-p} y2={y(0)} className="axis"/><polyline points={`${p},${h-p} ${points} ${w-p},${h-p}`} className="areaLine"/><polyline points={points} className="mainLine"/>{series.map((v,i)=><circle key={meses[i]} cx={x(i)} cy={y(v)} r="3.5" className="linePoint"><title>{meses[i]}: {v.toLocaleString('pt-BR',{maximumFractionDigits:2})}{suffix}</title></circle>)}</svg><div className="lineLabels">{meses.map(m=><span key={m}>{m.split('/')[0]}</span>)}</div></div>}'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/controle/page.tsx
          git commit -m 'fix: garantir grafico de fluxo com 12 meses'
          git push
