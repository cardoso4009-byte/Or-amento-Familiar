name: Diagnostico grafico fluxo
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar chamadas do grafico
        run: |
          grep -n -E 'Line|fluxoAcumulado|Evolução do Fluxo' app/controle/page.tsx || true
